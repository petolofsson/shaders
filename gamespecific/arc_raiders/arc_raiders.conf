enableOnLaunch = True
toggleKey = Home

reshadeTexturePath = /home/pol/code/shaders/gamespecific/arc_raiders/shaders
reshadeIncludePath = /home/pol/code/shaders/gamespecific/arc_raiders/shaders

# ── ANALYSIS ──────────────────────────────────────────────────────────────────
analysis_frame     = /home/pol/code/shaders/general/analysis-frame/analysis_frame.fx

# ── CORRECTIVE ────────────────────────────────────────────────────────────────
inverse_grade       = /home/pol/code/shaders/general/inverse-grade/inverse_grade.fx
corrective          = /home/pol/code/shaders/general/corrective/corrective.fx

# ── GRADE ─────────────────────────────────────────────────────────────────────
# grade.fx performs scene-adaptive print stock, gamut protection, chroma protection,
# and scene-cut damping internally; diffusion is intentionally not part of the grade.
grade            = /home/pol/code/shaders/general/grade/grade.fx

effects = analysis_frame:inverse_grade:corrective:grade
